name: E2E

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  packages: read

concurrency:
  group: e2e-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CHART_DIR: charts/llm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Ahead of the VM boot: a chart that does not render is worth ten seconds
      # to find out, not the twenty minutes the rest of this job takes. Release
      # is otherwise the first thing that lints it.
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.4

      - name: Lint chart
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
          helm dependency build "$CHART_DIR"
          helm lint "$CHART_DIR" --set llm.databaseUrl.value=dummy

      - name: Provision cluster
        uses: agynio/e2e/.github/actions/provision-vm@main

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Setup Buf
        uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          version: 1.66.0

      - name: Build source binary for DevSpace
        run: |
          set -euo pipefail
          buf generate buf.build/agynio/api --path agynio/api/llm/v1 --path agynio/api/authorization/v1 --path agynio/api/agents/v1 --path agynio/api/notifications/v1 --path agynio/api/secrets/v1
          mkdir -p dist
          CGO_ENABLED=0 go build -o dist/llm-devspace ./cmd/llm

      - name: Setup DevSpace
        uses: agynio/e2e/.github/actions/setup-devspace@main

      - name: Deploy llm from source
        run: devspace run-pipeline dev

      - name: Run E2E tests
        uses: agynio/e2e/.github/actions/run-tests@main
        with:
          tag: svc_llm
          include_smoke: "false"
        env:
          AGYN_MODEL_ID: source-deploy-check
          E2E_GO_TEST_RUN: TestLLMGatewayConnectEndpointPath
